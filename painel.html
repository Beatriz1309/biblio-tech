<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTech - Painel de Controle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-content">
            <span class="logo">📚 BiblioTech </span>
            <div class="nav-links">
                <span class="user-badge">Operador: <strong id="usuario-logado-nome">...</strong></span>
                <button id="btn-logout" class="btn-danger-sm">Desconectar</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="busca-emprestimo-grid">
            <section class="panel">
                <h3>🔍 Buscar Livro na Nuvem</h3>
                <div class="busca-group">
                    <input type="text" id="input-busca" placeholder="Digite o título do livro (Ex: Hobbit, Harry Potter)...">
                    <button id="btn-buscar" class="btn-primary">Pesquisar</button>
                </div>
                
                <div id="loading" class="hidden">Consultando Open Library API...</div>
                
                <div id="resultado-busca">
                    </div>
            </section>

            <section class="panel checkout-box">
                <div>
                    <h3>✅ Finalizar Empréstimo</h3>
                    <p><strong>Destinatário da Retirada:</strong> <span id="checkout-cliente-nome">...</span></p>
                    
                    <div id="livro-selecionado-status" class="status-vazio">
                        <p>Nenhum livro selecionado para esta conta ainda.</p>
                    </div>
                </div>

                <button id="btn-finalizar-emprestimo" class="btn-success action-btn" disabled>
                    Confirmar Empréstimo ( 10 Dias)
                </button>
            </section>
        </div>

        <section class="panel listagem-emprestimos">
            <h3>📋 Livros em Circulação (Empréstimos Ativos na Comunidade)</h3>
            <hr>
            <div id="grid-emprestimos" class="grid-cards">
                </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
