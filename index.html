<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTech - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>📚 BiblioTech</h1>
                <p>Sistema Gerenciador de Biblioteca</p>
            </div>
            
            <form id="form-login">
                <label for="select-login"><strong>Selecione o Usuário para Entrar:</strong></label>
                <select id="select-login" required>
                    </select>
                <button type="submit" class="btn-primary">Acessar Painel</button>
            </form>

            <div class="auth-footer">
                <p>Novo leitor na comunidade? <a href="cadastro.html">Cadastrar Novo Cliente</a></p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
